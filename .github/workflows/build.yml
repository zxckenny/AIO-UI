name: Build AIO UI APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Find project (folder or ZIP)
        id: project
        run: |
          set -euo pipefail
          find_app() {
            find "$1" -type f -path '*/app/build.gradle.kts' \
              -not -path '*/.git/*' -not -path '*/build/*' -print -quit
          }
          APP="$(find_app "$GITHUB_WORKSPACE")"
          if [ -z "$APP" ]; then
            ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print -quit)"
            if [ -n "$ZIP" ]; then
              echo "Extracting $ZIP"
              mkdir -p "$RUNNER_TEMP/proj"
              unzip -oq "$ZIP" -d "$RUNNER_TEMP/proj"
              APP="$(find_app "$RUNNER_TEMP/proj")"
            fi
          fi
          if [ -z "$APP" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -100
            exit 1
          fi
          ROOT="$(realpath "$(dirname "$(dirname "$APP")")")"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"
          echo "Project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/build.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIO-UI-build-log
          path: diagnostics/
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIO-UI-APK
          path: ${{ steps.project.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
