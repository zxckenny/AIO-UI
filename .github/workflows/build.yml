name: Build AIO UI APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" \
            ! -path "./.git/*" | head -n 1)

          if [ -n "$ZIP" ]; then
            unzip -oq "$ZIP" -d extracted
            SEARCH_DIR="extracted"
          else
            SEARCH_DIR="."
          fi

          APP_FILE=$(find "$SEARCH_DIR" -type f \
            -path "*/app/build.gradle.kts" \
            -not -path "*/build/*" | head -n 1)

          if [ -z "$APP_FILE" ]; then
            echo "Android app module not found!"
            exit 1
          fi

          ROOT=$(dirname "$(dirname "$APP_FILE")")
          ROOT=$(realpath "$ROOT")

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Configure project
        run: |
          cd "$PROJECT_ROOT"

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AIO-UI"
          include(":app")
          EOF

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIO-UI-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
