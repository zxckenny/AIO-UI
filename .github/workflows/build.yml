name: Build AIO UI APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          mkdir -p project

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP" ]; then
            unzip -q "$ZIP" -d project
            ROOT=$(find project -name build.gradle.kts \
              -not -path "*/build/*" | while read f; do
              d=$(dirname "$f")
              if [ -f "$d/app/build.gradle.kts" ]; then
                echo "$d"
                break
              fi
            done)
          else
            ROOT="."
          fi

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/app/build.gradle.kts" ]; then
            echo "::error::Android project not found"
            exit 1
          fi

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Fix Gradle settings
        run: |
          cd "$ROOT"

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AIO-UI"
          include(":app")
          EOF

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          cd "$ROOT"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" \
             output/AIO-UI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIO-UI-APK
          path: output/AIO-UI.apk
          if-no-files-found: error
          retention-days: 30
