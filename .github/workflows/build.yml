name: Build AIO UI APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Extract AIO UI
        shell: bash
        run: |
          set -e

          mkdir -p extracted diagnostics

          ZIP=$(find . -maxdepth 4 -type f \
            -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -n "$ZIP" ]; then
            echo "Found archive: $ZIP"
            unzip -oq "$ZIP" -d extracted
            SEARCH="extracted"
          else
            echo "No ZIP found. Searching repository."
            SEARCH="."
          fi

          APP=$(find "$SEARCH" -type f \
            -path "*/app/build.gradle.kts" \
            -not -path "*/build/*" | head -n 1)

          if [ -z "$APP" ]; then
            echo "::error::Cannot find app/build.gradle.kts"
            find "$SEARCH" -maxdepth 4 -type f
            exit 1
          fi

          ROOT=$(dirname "$(dirname "$APP")")
          ROOT=$(realpath "$ROOT")

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Configure Gradle settings
        run: |
          cd "$PROJECT_ROOT"

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AIOUI"
          include(":app")
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check environment
        run: |
          java -version
          gradle --version
          echo "SDK: $ANDROID_HOME"
          ls "$PROJECT_ROOT"
          ls "$PROJECT_ROOT/app"

      - name: Build APK
        shell: bash
        run: |
          set +e

          cd "$PROJECT_ROOT"

          gradle --no-daemon \
            --stacktrace \
            --info \
            :app:assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/build.log"

          RESULT=${PIPESTATUS[0]}

          echo "BUILD_EXIT_CODE=$RESULT"

          exit $RESULT

      - name: Collect diagnostics
        if: always()
        run: |
          echo "Build diagnostics"
          echo "================="

          if [ -f diagnostics/build.log ]; then
            tail -n 200 diagnostics/build.log
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIO-UI-Build-Logs
          path: diagnostics/
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIO-UI-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
